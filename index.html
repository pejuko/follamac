<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Follamac</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
  <h1>Follamac</h1>
  <img src="images/screenshot.png" alt="Screenshot" class="center-block" id="main-image">
  <p class="description">
    Follamac is a desktop application that provides a convenient way to work with <a href="https://ollama.com/">Ollama</a> and large language models (LLMs).
  </p>

  <h2>Download</h2>
  <p class="download">
    <a href="https://github.com/pejuko/follamac/releases/download/v0.1.3/Follamac-0.1.3.AppImage">Linux AppImage 0.1.3</a>
    or
    <a href="https://github.com/pejuko/follamac/releases/download/v0.1.3/Follamac-0.1.3-arm64.dmg">Mac arm64 dmg 0.1.3</a>
    or
    <a href="https://github.com/pejuko/follamac/releases/download/v0.1.3/Follamac.0.1.3.exe">Windows portable 0.1.3</a>
  </p>

  <p class="sourcecode">
    Source code is hosted on <a href="https://github.com/pejuko/follamac/">https://github.com/pejuko/follamac/</a>
  </p>
</div>
<script>
  (function() {
    // Check system preference on load
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.body.classList.toggle('dark-theme', isDark);
    
    // Set initial image based on theme
    updateImage(isDark);
    
    // Listen for system theme changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      document.body.classList.toggle('dark-theme', e.matches);
      updateImage(e.matches);
    });
    
    // Update image source based on theme
    function updateImage(isDarkTheme) {
      const img = document.getElementById('main-image');
      img.src = isDarkTheme ? 'images/screenshot-dark.png' : 'images/screenshot.png';
    }
  })();
</script>
</body>
</html>
